<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fikko</title>
    <meta name="description" content="Your entire day, simplified into one check-in. Track water, meals, meds, sleep, activity and mood, find healthy recipes, and see your trends. Completely ad-free." />

    <!-- Link previews (iMessage, WhatsApp, Slack, social). Update the URLs if the domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fikko" />
    <meta property="og:title" content="Fikko: your day in one check-in" />
    <meta property="og:description" content="Track water, meals, meds, sleep, activity and mood in one daily check-in. Completely ad-free." />
    <meta property="og:url" content="https://fikko-eta.vercel.app/" />
    <meta property="og:image" content="https://fikko-eta.vercel.app/icon-maskable-512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="The Fikko app icon" />
    <meta name="twitter:card" content="summary" />

    <link rel="manifest" href="/manifest.json" />
    <!-- Icons are the Fikko sprout. Tab and "any" app icons: sprout on a mint
         circle with see-through corners. Android "maskable" and iPhone icons:
         full mint background (those platforms crop or fill corners themselves).
         The link preview uses the full-background one so no black corners. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FAFAFA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Fikko" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
