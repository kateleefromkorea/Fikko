<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found · Fikko</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    :root { --fg: #171717; --muted: #5f6368; --primary: #157954; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: #fff; color: var(--fg); font: 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 420px; }
    img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
    h1 { font-size: 28px; line-height: 1.2; letter-spacing: -.02em; margin: 20px 0 8px; }
    p { color: var(--muted); margin: 0 0 24px; }
    .links { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a { display: inline-block; padding: 10px 20px; border-radius: 999px; font-weight: 600; text-decoration: none; border: 1px solid var(--primary); color: var(--primary); }
    a.main { background: var(--primary); color: #fff; }
    a:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #f5f5f5; --muted: #a3a3a3; --primary: #34b27d; }
      body { background: #111; }
      a.main { color: #0b0b0b; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/icon-192.png" alt="" />
    <h1>This page has wandered off</h1>
    <p>The link may be old or mistyped. Nothing's lost, though: everything is still where you left it.</p>
    <div class="links">
      <a class="main" href="/">Open Fikko</a>
      <a href="/help.html">Help</a>
    </div>
  </main>
</body>
</html>
